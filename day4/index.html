
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Toolkit - Day 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Notes Toolkit</h1>
      <p>Write your note and keep track of your words.</p>
    </header>

    <main>
      <section>
        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          rows="8"
          placeholder="Start typing your note here..."
        ></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <div class="buttons">
          <button id="clear-btn" type="button">Clear</button>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>
      </section>
    </main>

    <footer>
      <p>Day 4 Web Foundations Assignment</p>
    </footer>
  </body>
</html>
