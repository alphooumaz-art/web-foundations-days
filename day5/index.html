@'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <script src="users.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      background: #f5f7fa;
      color: #222;
    }

    h1 {
      color: #234e70;
    }

    button,
    input {
      padding: 10px;
      font-size: 1rem;
      margin: 6px 0 12px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 500px;
    }

    button {
      cursor: pointer;
      background: #234e70;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #users-list {
      list-style: none;
      padding: 0;
    }

    .user-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .user-card h2 {
      margin-top: 0;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>User Directory</h1>
    <p>Load, view, and filter users from a public API.</p>
  </header>

  <main>
    <section aria-labelledby="directory-heading">
      <h2 id="directory-heading">Directory</h2>

      <button id="load-users" type="button">Load Users</button>

      <div>
        <label for="filter-input">Filter users by name</label>
        <input
          type="search"
          id="filter-input"
          placeholder="Type a user's name..."
        >
      </div>

      <p id="status" role="status" aria-live="polite">
        Click Load Users to get started.
      </p>

      <ul id="users-list"></ul>
    </section>
  </main>

  <footer>
    <p>Day 5 Web Foundations Assignment</p>
  </footer>
</body>
</html>
'@ | Set-Content -Encoding utf8 index.html
